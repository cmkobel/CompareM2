[workspace]
channels = ["conda-forge", "bioconda"]
name = "comparem2"
platforms = ["linux-64"]
version = "3.1.0"

[tasks]
# The entry point. `pixi run cm2 <assemblies>...` — see `pixi run cm2 --help`.
cm2 = "python -m comparem2.cli"

pytest = "pytest tests/unit -q"

# Unpack the test genomes. They are shipped zipped and stay untracked once
# unpacked, which is what the tests/**/*.fna ignore rule is for.
unpack = "unzip -o -q tests/E._faecium/fna.zip -d tests/E._faecium"

# A real run over four genomes, no databases needed.
#
# Paths are listed rather than globbed only so the task is deterministic about
# which four it runs. A glob would also be safe: `tests/E._faecium/*.fna`
# expands correctly even though the set contains `116_2 duplicate.fna`, because
# glob results are not word-split — verified 2026-09-02. An earlier version of
# this comment claimed the opposite.
#
# The space still matters, just not here: it is the case canonicalise() and
# slug() exist to handle, and it becomes sample `116_2_duplicate`.
test-fast = { cmd = """
rm -rf cm2_test-fast && python -m comparem2.cli \
  "tests/E._faecium/116_2.fna" \
  "tests/E._faecium/116_2 duplicate.fna" \
  "tests/E._faecium/E8202.fna" \
  "tests/E._faecium/SRR24.fna" \
  --output cm2_test-fast --until seqkit mashtree treecluster skani
""", depends-on = ["unpack"] }

[activation.env]
# `python -m comparem2.cli` without an install step. `pyproject.toml` exists
# now — it is what the bioconda package is built from — but the pixi path
# deliberately does not install anything: the tools are already on PATH here,
# and running from `src` means an edit takes effect without a reinstall.
PYTHONPATH = "src"

# The pipeline's own dependencies, and nothing else. **The fourteen analysis
# tools are deliberately absent**: Snakemake deploys them per rule from the env
# files `catalogue.py` declares, which is the only way they arrive — for a
# bioconda install and for this one alike. Listing them here would create a
# second, untested way for a tool to be present, and would mean the same tool
# set was pinned in two files that could drift. It already had: `gtdbtk>=2.7`
# was pinned in catalogue.py and unpinned here.
#
# `conda` is a dependency, not an assumption. It used to be reached through a
# pixi *global* at ~/.pixi/bin/conda, which is not on PATH inside `pixi run` —
# so `--use-conda` died at DAG construction with "Error running conda info" on
# a machine that plainly had conda. Declaring it here removes the trap.
[dependencies]
python = ">=3.11"
snakemake = "<10"
snakemake-executor-plugin-cluster-generic = "*"
snakemake-executor-plugin-slurm = "*"
conda = "*"
# The TUI. Drives Snakemake through its logger plugin system rather than
# scraping stdout — see DECISIONS.md.
textual = "*"

[feature.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"

[environments]
default = { features = ["dev"] }
