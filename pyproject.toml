# Packaging metadata, for the one thing pixi cannot do: install CompareM2 as a
# package someone else can `conda install`.
#
# pixi.toml stays the development and HPC path, entered with
# `pixi run comparem2`. Since 2026-09-03 the two files describe the *same*
# thing: the pipeline alone. Neither carries the fourteen analysis tools —
# Snakemake deploys those into six conda environments at run time, with no flag
# to turn it off, and that is the only way a tool arrives on either route. See
# DESIGN.md, "One deployment model".
#
# Dependencies here are therefore the pipeline's own, not the fourteen tools'.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "comparem2"
dynamic = ["version"]
description = "A genomes-to-report pipeline for comparing microbial genomes"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Carl M. Kobel" }]
keywords = ["bioinformatics", "genomics", "snakemake", "pipeline"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
]

dependencies = [
    # Snakemake 9 is what the runner reads structured log events from; 10 has
    # not been tried. The floor is not cosmetic — `get_event()` and the
    # `job_info` record fields the TUI depends on are 9-era API.
    "snakemake>=9,<10",
    "textual",
    # Advertised in the docs, so they ship with the package rather than being
    # something a cluster user has to discover.
    "snakemake-executor-plugin-slurm",
    "snakemake-executor-plugin-cluster-generic",
]

[project.scripts]
# `comparem2` is the name the paper, the docs and the v2 bioconda package all
# use, so it is the one that must exist, and the one the docs and the pixi task
# spell out. `cm2` is kept as a shorter alias for typing at a prompt.
comparem2 = "comparem2.cli:main"
cm2 = "comparem2.cli:main"

[project.urls]
Homepage = "https://github.com/cmkobel/CompareM2"
Documentation = "https://comparem2.readthedocs.io"
Source = "https://github.com/cmkobel/CompareM2"

[tool.setuptools.dynamic]
# One source of truth for the version. A test asserts pixi.toml agrees.
version = { attr = "comparem2.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The only non-Python file in the package, and the reason it is a zip rather
# than six FASTAs: 460,821 bytes against 1,541,425 uncompressed, on a wheel that
# is 122,612 bytes without it. `--demo` extracts it into the run's own output
# directory. All three measured 2026-09-05; see src/comparem2/demo/__init__.py.
"comparem2.demo" = ["plasmids.zip"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "strict"
