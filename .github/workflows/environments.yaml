name: environments

# Builds every tool environment from scratch, weekly, and runs the tools in it.
# The unit workflow deliberately never deploys one (see unit.yaml); this one
# exists because the environments are re-solved by every new install, and
# bioconda moves underneath them between releases. What a job checks, and why
# a solve alone is not enough, is in tests/environments/check.py.
#
# Built with conda's `env create`, from the files the pipeline itself
# generates, because that is what Snakemake does on a user's machine.
#
# The `demo` job is the other half: `comparem2 --demo` as a user runs it, so
# Snakemake deploys the environments and runs the generated rules, then the
# same command again, which must find nothing to do. Four database-free tools
# on the bundled plasmids; the tools take seconds and the two environment
# builds take the rest.
#
# The `gtdbtk` job is the one database tool that fits on a runner, and only
# because its database is trimmed to 40 MB — see the job.

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays, 04:17 UTC
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.names.outputs.names }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - id: names
        run: echo "names=$(PYTHONPATH=src python tests/environments/check.py list)" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.list.outputs.names) }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: true
          activate-environment: ""

      - name: Write the environment files
        run: PYTHONPATH=src python tests/environments/check.py write "$RUNNER_TEMP/envs"

      - name: Build ${{ matrix.environment }}
        run: |
          conda --version
          conda env create --yes --quiet \
            --file "$RUNNER_TEMP/envs/${{ matrix.environment }}.yaml" \
            --prefix "$RUNNER_TEMP/env"
          conda list --prefix "$RUNNER_TEMP/env" --explicit > "$RUNNER_TEMP/${{ matrix.environment }}.lock.txt"

      - name: Run the tools in ${{ matrix.environment }}
        run: python tests/environments/check.py run ${{ matrix.environment }} --prefix "$RUNNER_TEMP/env"

      - name: Keep what was solved
        # The explicit package list, so a failure can be compared with the
        # last week that passed, package by package.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.environment }}-lock
          path: ${{ runner.temp }}/${{ matrix.environment }}.lock.txt
          if-no-files-found: ignore

  demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: true
          activate-environment: ""

      - name: Install CompareM2 from this checkout
        run: |
          python -m pip install --quiet .
          comparem2 --version

      - name: Run the demo
        run: comparem2 --demo --output "$RUNNER_TEMP/demo" --conda-prefix "$RUNNER_TEMP/envs"

      - name: Run it again, which must find nothing to do
        run: |
          # `|| status=$?` because the shell runs with -e, and the log is
          # wanted most when the command fails. Ended by `test`, not `exit`:
          # in a login shell (`bash -el`) the exit builtin runs ~/.bash_logout,
          # whose last test fails on a runner and turned an exit 0 into 1.
          status=0
          comparem2 --demo --output "$RUNNER_TEMP/demo" --conda-prefix "$RUNNER_TEMP/envs" \
            > "$RUNNER_TEMP/rerun.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/rerun.log"
          test "$status" -eq 0

      - name: Check the duplicate pair and the re-run
        run: python tests/environments/check.py demo "$RUNNER_TEMP/demo" --rerun-log "$RUNNER_TEMP/rerun.log"

  gtdbtk:
    # GTDB-Tk through the pipeline, against a trimmed reference package: 40 MB
    # instead of 60.8 GB. It holds five species, so it classifies the four test
    # genomes exactly as the real one does, but only by ANI screen — prodigal,
    # hmmer and pplacer are never reached. How it is built, and what it leaves
    # out, is in tests/environments/gtdb_mock.sh.
    runs-on: ubuntu-latest
    env:
      GTDB_CI_URL: https://github.com/cmkobel/CompareM2/releases/download/ci-data/gtdbtk_r232_ci.tar.gz
      GTDB_CI_MD5: 4f155d4bee65613370b35adbc1637977
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: true
          activate-environment: ""

      - name: Install CompareM2 from this checkout
        run: python -m pip install --quiet .

      - name: Fetch the trimmed GTDB package
        # Unpacked the way the pipeline unpacks the real one, and stamped the
        # way its fetch rule stamps it, so the pipeline takes it as fetched.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gtdb.tar.gz" "$GTDB_CI_URL"
          echo "$GTDB_CI_MD5  $RUNNER_TEMP/gtdb.tar.gz" | md5sum -c -
          mkdir -p "$RUNNER_TEMP/db/gtdb"
          tar -xzf "$RUNNER_TEMP/gtdb.tar.gz" -C "$RUNNER_TEMP/db/gtdb" --strip-components=1
          touch "$RUNNER_TEMP/db/gtdb/.fetched"

      - name: Run GTDB-Tk on the four test genomes
        run: |
          unzip -o -q tests/E._faecium/fna.zip -d tests/E._faecium
          comparem2 tests/E._faecium/*.fna --until gtdbtk \
            --databases "$RUNNER_TEMP/db" --output "$RUNNER_TEMP/out" \
            --conda-prefix "$RUNNER_TEMP/envs"

      - name: Check the classification
        run: python tests/environments/check.py gtdbtk "$RUNNER_TEMP/out"
